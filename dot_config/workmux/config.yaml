# workmux global config (https://workmux.dev). One tmux session per worktree,
# laid out like fish's omp-continue: nvim with omp (focused) on its right and
# the treemux file tree on its left. Start work from the Workmux palette
# (prefix w, or ctrl+space → Workmux; ~/.local/bin/workmux-palette) or
# `workmux add <branch>` in a repo. A .workmux.yaml in a repo overrides any
# of this.

nerdfont: true

# Session mode: the session pill and Ghostty's window title read
# <repo>/<handle>; the tmux-sessions palette lists them like any session.
mode: session
window_prefix: "{project}/"

# Next to worktrunk's ~/Work/<repo>-<branch>: ~/Work/<repo>/<handle>.
worktree_dir: ~/Work/{project}

# New work branches off the main branch, not whatever branch the pane is on.
base_branch: auto

# omp gets the prompt (-p/-P/-e) and names branches for `add -A`.
agent: omp

# `add -A` (the palette's New item) asks omp for the branch name. The name is
# the worktree dir, the session <repo>/<name> in the 30-column status-left
# pill, and the tab label (cut at 27), so keep it to ~16 characters.
auto_name:
  system_prompt: |
    Generate a git branch name for the task below. It is shown in narrow
    terminal tabs that cut it off after about 16 characters, so it must be
    short and readable at a glance.

    Rules:
    - kebab-case: lowercase letters, digits and hyphens only
    - 1-2 words, 3 only when needed; 16 characters at most
    - name the thing being changed, not how: drop filler words such as
      add, implement, make, update, support, feature, the, with
    - use common short forms when clear: auth, config, nav, anim, perf,
      deps, docs, ui, api, db
    - no type prefixes such as feat/ or fix/; use "fix" as a word only
      when the task is a bug fix

    Examples:
    - "Make the cards tappable and expandable with an animation" -> card-expand
    - "Fix the search results not showing" -> search-fix
    - "Add a dark mode toggle to settings" -> dark-mode
    - "Refactor the authentication module" -> auth-refactor
    - "Add CSV export to the reports page" -> csv-export

    Output only the branch name, nothing else.

# One window, unnamed so tmux.conf's automatic-rename-format labels it (nvim
# icon + file) like every other tab. The omp pane is workmux's <agent> pane,
# so it still gets the prompt (-p/-P/-e) and the agent status; nvim then runs
# omp-continue's layout, `nvim +OmpContinue` (the fish function's command
# inside tmux; the function itself is out of reach, since workmux types pane
# commands into tmux's default-shell, /bin/sh). :OmpContinue reuses an omp
# pane already in its window and only splits off its own `omp --continue`
# when there is none, and nvim starts first, so it waits (5 s at most) for
# the agent pane's omp to come up. tmux's even-out hooks spread the two
# panes evenly while workmux builds the window, so the omp pane is then put
# back at 25% and marked @treemux-keep-width (as :OmpContinue's own split
# is), which keeps the hooks off this window; the 10% treemux tree then comes
# out of nvim's share (tree 10%, nvim 65%, omp 25%). exec keeps nvim the
# pane's command.
windows:
  - panes:
      - command: >-
          i=0; until p=$(tmux list-panes -t "$TMUX_PANE" -F '#{pane_id} #{pane_current_command}' | awk '$2 == "omp" { print $1 }') && [ -n "$p" ] || [ $i -ge 50 ]; do sleep 0.1; i=$((i+1)); done;
          [ -n "$p" ] && tmux set -p -t "$p" @treemux-keep-width 1 \; resize-pane -t "$p" -x 25%;
          exec nvim +OmpContinue
        focus: true
      - command: <agent>
        split: horizontal
        percentage: 25

# tmux.conf's window-status formats render #{@workmux_status} themselves;
# workmux's own format would replace the powerline tabs.
status_format: false
