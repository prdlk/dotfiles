# Popup backdrop: while a popup (display-popup: lazygit, palettes, the workmux
# dashboard, omp, ...) is open, the text of every pane in the window behind it
# turns muted gray, so only the popup stands out; backgrounds stay as they are.
# Only text in the default color dims (tmux recolors default cells; programs'
# own colors and the dim attribute pass through). tmux has no popup hooks, so
# a command alias named display-popup sets the window-level styles, starts
# popup-undim.sh, then runs the real command with the caller's arguments (an
# alias does not re-expand itself; the CLI `tmux display-popup` of the
# palettes and pj-palette goes through it too). popup-undim.sh waits for the
# popup's process to exit and unsets the styles: pane-focus-in is not raised
# reliably when a popup closes. First in the file: a binding's commands are
# parsed when it is bound, so only bindings after the alias go through it.
set -g @popup-dim-style "fg=#7b8496"
set -s 'command-alias[100]' 'display-popup=set -wF window-style "#{@popup-dim-style}" ; set -wF window-active-style "#{@popup-dim-style}" ; run-shell -b "~/.config/tmux/popup-undim.sh #{window_id}" ; display-popup'

# Prefix: ctrl+b (Ghostty's ctrl+shift chords send it as \x02). ctrl+space
# is not a prefix: it opens tmux-palette (root table, see Plugins).
set -g prefix C-b
set -gu prefix2
unbind -q C-Space
bind -N "Send prefix" C-b send-prefix

set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "if command -v omarchy-menu-tmux-keybindings >/dev/null; then omarchy-menu-tmux-keybindings --print; else tmux list-keys -N; fi | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel
bind -N "Search scrollback" / copy-mode \; command-prompt -p "search up:" "send -X search-backward '%%'"

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

# ctrl+h/j/k/l: vim-aware pane navigation, the tmux half of smart-splits.nvim
# (nvim's config.pane_nav hands tmux panes to it). In an nvim/vim/fzf pane the
# key is forwarded so nvim moves between its own splits and, at its outer edge,
# selects the tmux pane itself; elsewhere tmux moves directly. "Is vim" is
# smart-splits' @pane-is-vim pane option or the pane's foreground command
# (vim without smart-splits, fzf), read as a format (no ps fork per keypress).
# Ghostty passes these keys through (keybind = clear); prefix + ctrl+l is the
# clear-screen escape hatch.
bind -N "Focus pane left (vim-aware)" -n C-h if -F '#{||:#{@pane-is-vim},#{m/r:^(n?vim|vim|fzf)$,#{pane_current_command}}}' 'send-keys C-h' 'select-pane -L'
bind -N "Focus pane down (vim-aware)" -n C-j if -F '#{||:#{@pane-is-vim},#{m/r:^(n?vim|vim|fzf)$,#{pane_current_command}}}' 'send-keys C-j' 'select-pane -D'
bind -N "Focus pane up (vim-aware)" -n C-k if -F '#{||:#{@pane-is-vim},#{m/r:^(n?vim|vim|fzf)$,#{pane_current_command}}}' 'send-keys C-k' 'select-pane -U'
bind -N "Focus pane right (vim-aware)" -n C-l if -F '#{||:#{@pane-is-vim},#{m/r:^(n?vim|vim|fzf)$,#{pane_current_command}}}' 'send-keys C-l' 'select-pane -R'
bind -N "Focus pane left" -T copy-mode-vi C-h select-pane -L
bind -N "Focus pane down" -T copy-mode-vi C-j select-pane -D
bind -N "Focus pane up" -T copy-mode-vi C-k select-pane -U
bind -N "Focus pane right" -T copy-mode-vi C-l select-pane -R
bind -N "Clear screen" C-l send-keys C-l

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# alt+h/j/k/l: vim-aware resize, smart-splits' resize keys. An @pane-is-vim
# pane gets the key, so smart-splits resizes its split and, at its outer edge,
# the tmux pane; elsewhere tmux resizes by 3, smart-splits' default amount.
# Only @pane-is-vim forwards: vim/fzf without smart-splits have no resize binds.
bind -N "Resize pane left (vim-aware)" -n M-h if -F '#{@pane-is-vim}' 'send-keys M-h' 'resize-pane -L 3'
bind -N "Resize pane down (vim-aware)" -n M-j if -F '#{@pane-is-vim}' 'send-keys M-j' 'resize-pane -D 3'
bind -N "Resize pane up (vim-aware)" -n M-k if -F '#{@pane-is-vim}' 'send-keys M-k' 'resize-pane -U 3'
bind -N "Resize pane right (vim-aware)" -n M-l if -F '#{@pane-is-vim}' 'send-keys M-l' 'resize-pane -R 3'

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# Nested sessions (ssh into a host running tmux): F11 turns the local tmux's
# bindings off so every key, prefix included, reaches the remote tmux; the
# status bar goes gray on black while it is off. F11 again turns them back on.
bind -N "Local keys off (control the remote tmux)" -n F11 \
    set prefix None \; \
    set key-table off \; \
    set status-style "fg=gray,bg=black" \; \
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
    refresh-client -S
bind -N "Local keys back on" -T off F11 \
    set -u prefix \; \
    set -u key-table \; \
    set -u status-style \; \
    refresh-client -S

# General
# Panes run fish, the primary interactive shell, through default-command.
# default-shell, which runs that line and every run-shell, #() job, popup and
# split-window command, is /bin/sh: it would otherwise be the login shell
# (fish, whose `fish -c` loads the whole config, ~55 ms per command), and the
# commands here are sh syntax. Falls back to the login shell where fish is
# missing (kitty's ssh kitten copies this config to remote hosts).
# default-command must be one plain command: tmux-resurrect restores a pane as
# `cat <contents>; exec <default-command>`, so a compound line (`a && exec b`)
# makes `exec` replace the pane's shell with `a`, and every restored pane exits
# at once (the server then exits with no sessions left).
set -g default-shell /bin/sh
set -g default-command '"$SHELL" -l'
if 'command -v fish >/dev/null 2>&1' 'set -g default-command "fish -l"'
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
# Yazi inside tmux: OSC 52 clipboard, image passthrough, and the outer
# TERM/TERM_PROGRAM so yazi detects Ghostty/kitty graphics. Never bind M-[:
# tmux would eat the ESC [ of yazi's terminal-query replies.
set -g set-clipboard on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
setw -g aggressive-resize on
# Killing a session switches only to a *detached* one, else detaches: with
# one session per Ghostty window, `off` would land on (and mirror) a session
# another window is showing.
set -g detach-on-destroy no-detached
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
# shift+enter (Ghostty sends ESC[13;2u): pass it through as ESC[13;2u for
# coding agents (omp, claude) to insert a newline. With extended-keys `on`,
# tmux would flatten it to a plain Enter for any app that never asked for
# extended keys.
bind -N "Shift+Enter as CSI-u" -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75
set -as terminal-features ",*:clipboard"
# OSC 8 hyperlinks: tmux keeps the links programs print and forwards them to
# Ghostty (apply with `tmux kill-server`, not a reload). With `mouse on`
# Ghostty's own ctrl+click never fires (tmux gets the click), so tmux opens
# the OSC 8 link under the mouse itself; any other ctrl+click goes to the
# pane. Plain-text URLs: ctrl+shift+click (Ghostty).
set -as terminal-features ",*:hyperlinks"
bind -N "Open hyperlink under mouse" -n C-MouseDown1Pane if -F '#{mouse_hyperlink}' \
    'run-shell -b "if command -v xdg-open >/dev/null; then xdg-open #{q:mouse_hyperlink}; else open #{q:mouse_hyperlink}; fi >/dev/null 2>&1"' \
    'select-pane -t = ; send-keys -M'
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
# Each window is named after the program in its active pane (omp, nvim, fish,
# lazygit, …; a login shell's leading "-" dropped): #{pane_current_command},
# the same value tmux-nerd-font-window-name picks #{window_icon} by (icons in
# tmux-nerd-font-window-name.yml), so name and icon always agree. No file
# names, repos or titles.
set -gw automatic-rename-format '#{window_icon} #{s/^-//:pane_current_command}'
set -g set-titles on
# The terminal (Ghostty) window title is the session name: one session per
# Ghostty window, so compositor groups/tabs list sessions, not host:window.
set -g set-titles-string '#S'

# Theme — kitty's powerline/angled tab bar: the current window is an
# accent-tinted plate (accent mixed 20% into the background) with the accent
# as its text, the rest sit flush with the background in muted text. Fixed
# cyberdream palette, shared with Ghostty, nvim, yazi and television so every
# machine (Linux, mac, goliath) looks the same.
set -g @tab-bg "#16181a"
set -g @tab-fg "#7b8496"
set -g @tab-active-bg "#243348"
set -g @tab-active-fg "#5ea1ff"

set -g status-style "bg=default,fg=#{@tab-fg}"
# bg=default inside a tab format means "the window-status-*-style bg", not the
# terminal's, so these must stay default for the tabs to be transparent. Set
# explicitly: a config reload never clears a value a removed plugin left
# behind (tmux-dotbar painted window-status-style bg=#0B0E14).
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-activity-style default
set -g window-status-bell-style default
# Tabs start right after the session pill (status-justify left; a reload
# would otherwise keep a stale value such as dotbar's absolute-centre), and
# the pill's arrow points into the first tab's plate.
set -g status-justify left
set -g status-left "#[fg=#{@tab-bg},bg=#{@tab-active-fg},bold] #S #[fg=#{@tab-active-fg},nobold]#{?#{==:#{active_window_index},#{base-index}},#[bg=#{@tab-active-bg}],#[bg=default]}"
set -g status-right "#[fg=#{@tab-active-fg}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#{@tab-fg}]#h "
# Inactive tabs are bg=default so the terminal's transparency shows through,
# as in kitty (tab_bar_background none). kitty's separator rule: a solid
#  into a differently colored neighbour, thin  between two inactive
# tabs, none after the last. The arrow into the current tab is painted in
# @tab-bg, the window background (Ghostty's cyberdream background, the same
# hex), so it blends into the window. (Plain  is
# one of Ghostty's built-in sprites and fills the whole cell even with
# adjust-cell-height; inverse glyphs such as  come from the font and
# leave gaps.)
# #{@workmux_status} is the agent status icon workmux sets on a window
# (workmux's status_format is off so it leaves these formats alone).
set -g window-status-format "#[fg=#{@tab-fg},bg=default] #I #W#{?@workmux_status, #{@workmux_status},} #{?next_window_active,#[fg=#{@tab-bg}#,bg=#{@tab-active-bg}],#{?window_end_flag,,}}"
set -g window-status-current-format "#[fg=#{@tab-active-fg},bg=#{@tab-active-bg},bold] #I #W#{?@workmux_status, #{@workmux_status},} #[fg=#{@tab-active-bg},bg=default,nobold]"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=#{@tab-active-fg}"
set -g message-style "bg=default,fg=#{@tab-active-fg}"
set -g message-command-style "bg=default,fg=#{@tab-active-fg}"
set -g mode-style "bg=#{@tab-active-bg},fg=#{@tab-active-fg}"
# Popups (lazygit, tasks, keybindings): explicit bg so Ghostty draws them
# opaque (background-opacity only applies to default-bg cells; a default-bg
# popup shows the pane behind it through the blur).
set -g popup-style "bg=#{@tab-bg},fg=#dcc1b7"
set -g popup-border-style "bg=#{@tab-bg},fg=#{@tab-active-fg}"
set -g popup-border-lines rounded
setw -g clock-mode-colour blue

# Plugins (tpm, cloned by .chezmoiexternal.toml). prefix + I installs,
# prefix + U updates, prefix + alt + u removes unlisted ones.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# prdlk fork of eduwass/tmux-palette: adds custom palettes' `query` item.
set -g @plugin 'prdlk/tmux-palette-plugin'

# treemux: a Neo-tree file explorer sidebar, a full-height column at the
# window's left edge (prdlk fork, below), following the shell's cwd (git root
# as the tree root). This is the only file tree: nvim has Neo-tree disabled.
# Per window, not persistent: prefix + Tab toggles this window's tree and
# keeps focus; prefix + BSpace toggles it and focuses it (Ghostty /
# kitty-tmux ctrl+shift+e); `Q` in the tree closes it, nvim's ctrl+e focuses
# (or opens) it.
# Enter opens a file in the window's nvim if it has one, else in a new nvim
# split off the shell's pane (treemux's editor position/size, top 70%); `t`
# opens it in the shell's pane itself; `-` sends the path to the shell
# (tmux-send).
# The tree's nvim is ~/.config/tmux/treemux_init.lua under its own
# NVIM_APPNAME.
set -g @treemux-persistent 'off'
# The init file rides in the nvim command, not @treemux-tree-nvim-init-file
# (upstream treemux drops that one for a right tree). The command is pasted
# unquoted into a shell line, so the path must not contain spaces or commas
# ($HOME expands here, ~ would not).
set -g @treemux-tree-client 'neo-tree'
set -g @treemux-tree-position 'left'
set -g @treemux-nvim-command "NVIM_APPNAME=nvim-treemux nvim -u $HOME/.config/tmux/treemux_init.lua"
# 32 columns, the width of the editor's old Neo-tree sidebar, for every root.
# treemux would otherwise reuse the width a sidebar had when it was last
# closed in that root (directory_widths.txt; one root had saved 1 column).
# There is no option to turn that off, so the file is /dev/null: saving
# appends to it, lookups find nothing. (Still capped at half the pane.)
set -g @treemux-tree-width 32
run-shell 'd="${XDG_DATA_HOME:-$HOME/.local/share}/tmux/treemux"; mkdir -p "$d" && ln -sfn /dev/null "$d/directory_widths.txt"'
# Follow the shell's cd within 0.1 s while the shell or the tree is focused
# (the fork's watcher reads /proc and does nothing between changes, so a fast
# poll is cheap; unfocused it stays at treemux's 2 s / 5 s).
set -g @treemux-refresh-interval 0.1
# prdlk fork of kiyoon/treemux: the sidebar is a full-height column at the
# window's edge (split-window -hbf on the left), re-anchored there by hooks
# after splits and layout changes; the persistent mode (scripts/persistent.sh)
# keeps one in every window; the watcher follows the shell through /proc and
# nvim RPC instead of lsof and Python (pynvim) helpers.
set -g @plugin 'prdlk/treemux'

# tmux-palette: Raycast-style command palette on ctrl+space (no prefix; needs
# bun). User config (commands ported from kitty, cyberdream theme, Ghostty
# shortcut labels) lives in ~/.config/tmux-palette/.
set -g @palette-key 'C-Space'
# pj's task runner as a palette (pj-palette): quick actions + project tasks,
# one-offs in a bottom split, dev servers / compose up in a new window of
# this session, started in the background (focus stays). prefix + t (Ghostty
# ctrl+shift+p / +space).
bind -N "Project tasks (pj)" t run-shell "~/.config/tmux/plugins/tmux-palette-plugin/bin/tmux-palette.sh tasks"
# Session picker (tmux-sessions): other sessions, every window, zoxide and
# ~/.config dirs, rename/kill; a query that matches nothing becomes a new
# session in its zoxide match. prefix + o (Ghostty ctrl+shift+o).
bind -N "Sessions" o run-shell "~/.config/tmux/plugins/tmux-palette-plugin/bin/tmux-palette.sh sessions"
# tmux-expose: every session as a live text thumbnail in a full-screen popup,
# arrows/type to filter, Enter switches. prefix + E (replaces select-layout -E),
# Ghostty ctrl+backspace. The popup receives that chord again as C-b E, and
# TMUX_EXPOSE_TOGGLE_KEY=E closes it (until a filter is being typed). Card
# colors: cyberdream accent (selected), green (attached), muted (rest).
bind -N "Session exposé (tmux-expose)" E display-popup -w 100% -h 100% -e TMUX_EXPOSE_TOGGLE_KEY=E -E "tmux-expose --selected-color '#5ea1ff' --attached-color '#5eff6c' --inactive-color '#7b8496'"
# Workmux palette (workmux-palette): tracked agents by status, this repo's
# worktrees (open/close/merge/remove), new worktree from typed branch or a
# prompt, dashboard, sidebar. prefix + w, or ctrl+s inside the sidebar
# (replaces choose-tree, which the sessions palette covers).
bind -N "Workmux" w run-shell "~/.config/tmux/plugins/tmux-palette-plugin/bin/tmux-palette.sh workmux"
# workmux dashboard (all agents) in a 90% popup, like the palette's Dashboard
# item. prefix + S, Ghostty ctrl+shift+a and ctrl+shift+s. workmux's agent
# sidebar has no key: treemux holds the left edge.
bind -N "Workmux dashboard popup" S display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "workmux dashboard"
# ctrl+q in the sidebar quits it without its "Quit sidebar? yes / no" prompt
# (workmux reads ctrl+q as q, which asks; it has no option to skip that).
# `workmux sidebar off` is what confirming does: every sidebar closes. Other
# panes get ctrl+q unchanged.
bind -N "Quit workmux sidebar (no prompt) in a sidebar pane" -n C-q if -F '#{==:#{@workmux_role},sidebar}' 'run-shell -b "workmux sidebar off"' 'send-keys C-q'
# ctrl+g in the sidebar opens the workmux dashboard in a 90% popup, as the
# Workmux palette's Dashboard item does (the sidebar would read it as g, jump
# to top). Other panes get ctrl+g unchanged (nvim's git prefix).
bind -N "Workmux dashboard popup in a sidebar pane" -n C-g if -F '#{==:#{@workmux_role},sidebar}' 'display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "workmux dashboard"' 'send-keys C-g'
# ctrl+s in the sidebar opens the Workmux palette, as prefix + w does (the
# sidebar would read it as s, fold the group). Other panes get ctrl+s
# unchanged (nvim's save).
bind -N "Workmux palette in a sidebar pane" -n C-s if -F '#{==:#{@workmux_role},sidebar}' 'run-shell "~/.config/tmux/plugins/tmux-palette-plugin/bin/tmux-palette.sh workmux"' 'send-keys C-s'

# Direct launchers, the kitty ctrl+shift chords (Ghostty sends prefix + key).
# Programs are exec'd so the tab icon is the program's.
bind -N "Yazi in a new window" y new-window -c "#{pane_current_path}" "exec yazi"
bind -N "Neovim in a new window" e new-window -c "#{pane_current_path}" "exec nvim"
# Lazygit fills the client: 100% both ways, no border (-B), so no gaps.
bind -N "Lazygit popup (full screen)" g display-popup -E -B -w 100% -h 100% -d "#{pane_current_path}" lazygit
# omp in a background session <session>:omp shown in a popup (pj-palette --bg,
# listed under Running in the tasks palette). Inside any such popup, prefix + a
# hides it instead, so prefix + a toggles.
bind -N "omp popup (toggle)" a if -F "#{@pj_task}" detach-client \
    'run-shell -b "~/.local/bin/pj-palette --bg #{q:session_name}:omp #{q:pane_current_path} omp"'

# Persistence: continuum saves every 10 min (resurrect: prefix + C-s save,
# prefix + C-r restore) and restores the last save when the server starts,
# i.e. the first Ghostty window after login or reboot. Saves live in
# ~/.local/share/tmux-resurrect (resurrect expands $HOME itself).
set -g @resurrect-dir '$HOME/.local/share/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# omp panes come back in their own session: resurrect-omp.sh rewrites each
# omp pane's saved command to `omp --resume <session file>` after every save,
# and omp joins the replayed programs (nvim, vim, less, ... are resurrect's
# defaults).
set -g @resurrect-processes 'omp'
set -g @resurrect-hook-post-save-layout '~/.config/tmux/resurrect-omp.sh'
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'

# Keep at the very bottom.
run '~/.config/tmux/plugins/tpm/tpm'
