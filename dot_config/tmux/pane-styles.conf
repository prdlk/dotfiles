# Pane styles, sourced by tmux.conf and re-sourced by the Omarchy theme-set
# hook (~/.config/omarchy/hooks/theme-set.d/20-tmux-nvim): every theme switch
# runs omarchy-theme-set-tmux first, which sets both styles below to the
# theme's `fg=…,bg=…`. An explicit bg is opaque in Ghostty (background-opacity
# only applies to default-bg cells), so that turned every pane into a solid
# block on the frosted glass.
#
# Both default: panes keep the terminal's own foreground and background (the
# glass), active or not.
set -g window-style default
set -g window-active-style default
