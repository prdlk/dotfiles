"$schema" = 'https://starship.rs/config-schema.json'

# No palette: every style is an ANSI name (blue, purple, bright-black, ...), so
# the prompt takes the terminal's 16 colours. On Omarchy those come from the
# active theme's colors.toml (Ghostty includes the generated ghostty.conf, tmux
# panes get the OSC palette), so cyberdream draws neon and Hazy Peak graphite
# with its #c67777 red, and a theme switch recolours the prompt with no edit.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$python\
$character"""

add_newline = true

right_format = """$time"""

# zsh transient prompt (~/.zshrc). `starship prompt --profile` emits
# zsh-escaped output; `starship module` doesn't, which breaks RPROMPT width.
[profiles]
transient = "$character"
transient_right = "$time"

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](red) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

[time]
disabled = false
format = '[$time]($style)'
time_format = '%-I:%M %p'
style = "bright-black"
