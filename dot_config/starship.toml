"$schema" = 'https://starship.rs/config-schema.json'
palette = "cyberdream"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$python\
$character"""

add_newline = true

right_format = """$time"""

# zsh transient prompt (~/.zshrc). `starship prompt --profile` emits
# zsh-escaped output; `starship module` doesn't, which breaks RPROMPT width.
[profiles]
transient = "$character"
transient_right = "$time"

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

[time]
disabled = false
format = '[$time]($style)'
time_format = '%-I:%M %p'
style = "bright-black"

[palettes.cyberdream]
# https://github.com/scottmckendry/cyberdream.nvim
black = "#1e2124"
red = "#ff6e5e"
green = "#5eff6c"
yellow = "#f1ff5e"
blue = "#5ea1ff"
purple = "#bd5eff"
cyan = "#5ef1ff"
white = "#ffffff"

bright-black = "#4a4d4f"
bright-red = "#ff8b7e"
bright-green = "#7eff89"
bright-yellow = "#f3ff7e"
bright-blue = "#7eb3ff"
bright-purple = "#ff7ef3"
bright-cyan = "#7ef3ff"
bright-white = "#ffffff"

# Dim variants (usable as named colors in styles)
dim-black = "#1c1f22"
dim-red = "#d05c50"
dim-green = "#4fd05b"
dim-yellow = "#c5d050"
dim-blue = "#4f85d1"
dim-purple = "#d050c6"
dim-cyan = "#4fc5d1"
dim-white = "#d0d0d1"
