# Agent skills come from one place: github.com/prdlk/skills, installed whole by
# the Skills CLI. .chezmoiscripts/run_onchange_after_25-skills.sh.tmpl re-runs
# whenever this file changes: it installs every skill in the source
# (`skills add <source> -g -y -a <agents> --skill '*'`), then removes any
# CLI-installed skill whose recorded source is something else.
#
# source: anything `skills add` accepts. Pin a ref with a tree URL
#   (https://github.com/prdlk/skills/tree/<ref>).
# agents: `universal` is the shared ~/.agents/skills library (Codex, Gemini
#   CLI, OpenCode, Zed, …); `claude-code` links ~/.claude/skills/<name>.
#
# Skills that other packages install (omarchy and diagnose-crash from
# /usr/share/omarchy, terminal-browser) are not in the CLI's lock file and are
# never touched.
skills:
  cli: skills@1.7.0
  agents: [universal, claude-code]
  source: prdlk/skills
