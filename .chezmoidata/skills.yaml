# Agent skills, installed by the Skills CLI instead of being vendored in this
# repo. .chezmoiscripts/run_onchange_after_25-skills.sh.tmpl re-runs whenever
# this file changes: it installs every skill below (`skills add <source> -g -y
# -a <agents> --skill <name>…`, one call per source) and removes CLI-installed
# skills that are no longer listed.
#
# source: anything `skills add` accepts — owner/repo (default branch), a
#   GitHub tree URL (pins a ref or subdirectory), or a well-known endpoint URL.
#   Skills that upstream deleted are pinned to the last ref that has them.
# agents: optional; defaults to `agents` below. `universal` is the shared
#   ~/.agents/skills library (Codex, Gemini CLI, OpenCode, Zed, …);
#   `claude-code` links ~/.claude/skills/<name>.
#
# Not listed (installed by other packages, never touched by the sync):
# omarchy and diagnose-crash (/usr/share/omarchy), terminal-browser.
skills:
  cli: skills@1.7.0
  agents: [universal, claude-code]
  sources:
    - source: affaan-m/everything-claude-code
      skills: [rust-testing]
    - source: apollographql/skills
      skills: [rust-best-practices]
    - source: charlietlamb/openlogs
      skills: [openlogs-server-logs]
    - source: cloudflare/skills
      skills: [cloudflare, workers-best-practices, wrangler]
    - source: coldteadotai/pr-lens
      skills: [eli5, pr-lens]
    - source: Dammyjay93/interface-design
      skills: [interface-design]
    - source: deckardger/tanstack-agent-skills
      skills:
        - tanstack-integration-best-practices
        - tanstack-query-best-practices
        - tanstack-router-best-practices
        - tanstack-start-best-practices
    - source: Doist/todoist-cli
      skills: [todoist-cli]
    - source: finesssee/linear-cli
      skills: [linear-documents]
    - source: Forward-Future/loop-library
      skills: [loopy]
    - source: h4ckf0r0day/obscura
      skills: [obscura]
    - source: hardikpandya/stop-slop
      skills: [stop-slop]
    - source: jeffallan/claude-skills
      skills: [golang-pro]
    - source: leonardomso/rust-skills
      skills: [rust-skills]
    - source: Leonxlnx/taste-skill
      skills:
        - brandkit
        - design-taste-frontend
        - gpt-taste
        - high-end-visual-design
